<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RAG Chatbot</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f2f5;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #1a1a2e;
      color: white;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    header h1 { font-size: 1.2rem; font-weight: 600; }
    header p  { font-size: 0.8rem; opacity: 0.6; margin-top: 2px; }

    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
    }

    .message {
      display: flex;
      flex-direction: column;
      max-width: 75%;
    }

    .message.user  { align-self: flex-end; align-items: flex-end; }
    .message.bot   { align-self: flex-start; align-items: flex-start; }

    .bubble {
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 0.92rem;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .user .bubble {
      background: #1a1a2e;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .bot .bubble {
      background: white;
      color: #333;
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    .sources {
      font-size: 0.75rem;
      color: #888;
      margin-top: 4px;
      padding: 0 4px;
    }

    .sources span {
      background: #e8eaf6;
      color: #3949ab;
      padding: 2px 8px;
      border-radius: 10px;
      margin-right: 4px;
      display: inline-block;
      margin-top: 3px;
    }

    .typing .bubble {
      color: #aaa;
      font-style: italic;
    }

    #input-area {
      background: white;
      border-top: 1px solid #e0e0e0;
      padding: 16px 24px;
    }

    #input-row {
      display: flex;
      gap: 10px;
      max-width: 800px;
      margin: 0 auto;
    }

    #question {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #ddd;
      border-radius: 24px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    #question:focus { border-color: #1a1a2e; }

    #send-btn {
      background: #1a1a2e;
      color: white;
      border: none;
      border-radius: 24px;
      padding: 12px 24px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    #send-btn:hover    { background: #16213e; }
    #send-btn:disabled { background: #aaa; cursor: not-allowed; }

    #mic-btn {
      background: #1a1a2e;
      color: white;
      border: none;
      border-radius: 50%;
      width: 46px;
      height: 46px;
      font-size: 1.1rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    #mic-btn:hover    { background: #16213e; }
    #mic-btn:disabled { background: #aaa; cursor: not-allowed; }
    #mic-btn.recording {
      background: #c0392b;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%   { transform: scale(1); box-shadow: 0 0 0 0 rgba(192,57,43,0.5); }
      70%  { transform: scale(1.05); box-shadow: 0 0 0 8px rgba(192,57,43,0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(192,57,43,0); }
    }

    #voice-status {
      text-align: center;
      font-size: 0.78rem;
      color: #c0392b;
      height: 18px;
      margin-bottom: 6px;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
    }

    #welcome {
      text-align: center;
      color: #aaa;
      margin-top: 60px;
    }

    #welcome h2 { font-size: 1.4rem; color: #555; margin-bottom: 8px; }
    #welcome p  { font-size: 0.9rem; }
  </style>
</head>
<body>

<header>
  <div>
    <h1>📄 RAG Chatbot</h1>
    <p>Ask anything about your documents</p>
  </div>
</header>

<div id="chat-container">
  <div id="welcome">
    <h2>Hello! How can I help?</h2>
    <p>Ask me anything about the uploaded documents.</p>
  </div>
</div>

<div id="input-area">
  <div id="voice-status"></div>
  <div id="input-row">
    <button id="mic-btn" onclick="toggleRecording()" title="Hold to record voice">🎤</button>
    <input
      id="question"
      type="text"
      placeholder="Ask a question or click 🎤 to speak..."
      autocomplete="off"
    />
    <button id="send-btn" onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
  let sessionId = null;
  let mediaRecorder = null;
  let audioChunks = [];
  let isRecording = false;

  // ── Session ──────────────────────────────────────────────────────────────
  async function initSession() {
    const res = await fetch("/session/new", { method: "POST" });
    const data = await res.json();
    sessionId = data.session_id;
  }

  // ── UI helpers ───────────────────────────────────────────────────────────
  function setVoiceStatus(msg) {
    document.getElementById("voice-status").textContent = msg;
  }

  function appendMessage(role, text, sources = []) {
    const welcome = document.getElementById("welcome");
    if (welcome) welcome.remove();

    const container = document.getElementById("chat-container");

    const msg = document.createElement("div");
    msg.className = `message ${role}`;

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    msg.appendChild(bubble);

    if (sources.length > 0) {
      const src = document.createElement("div");
      src.className = "sources";
      src.innerHTML = "📎 Sources: " + sources.map(s => `<span>${s}</span>`).join("");
      msg.appendChild(src);
    }

    container.appendChild(msg);
    container.scrollTop = container.scrollHeight;
    return msg;
  }

  // ── Text-to-speech ───────────────────────────────────────────────────────
  function speak(text) {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const utt = new SpeechSynthesisUtterance(text);
    utt.rate = 1.0;
    utt.pitch = 1.0;
    window.speechSynthesis.speak(utt);
  }

  // ── Chat ─────────────────────────────────────────────────────────────────
  async function sendMessage(questionOverride) {
    const input = document.getElementById("question");
    const btn   = document.getElementById("send-btn");
    const micBtn = document.getElementById("mic-btn");
    const question = (questionOverride || input.value).trim();
    if (!question || !sessionId) return;

    input.value = "";
    btn.disabled = true;
    micBtn.disabled = true;

    appendMessage("user", question);
    const typing = appendMessage("bot typing", "Thinking...");

    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId, question }),
      });
      const data = await res.json();

      typing.remove();
      appendMessage("bot", data.answer, data.sources);
      speak(data.answer);
    } catch (err) {
      typing.remove();
      appendMessage("bot", "Sorry, something went wrong. Please try again.");
    }

    btn.disabled = false;
    micBtn.disabled = false;
    input.focus();
  }

  // ── Voice recording ──────────────────────────────────────────────────────
  async function toggleRecording() {
    if (isRecording) {
      stopRecording();
    } else {
      await startRecording();
    }
  }

  async function startRecording() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      audioChunks = [];

      // Pick a supported MIME type
      const mimeType = ["audio/webm;codecs=opus", "audio/webm", "audio/ogg;codecs=opus", "audio/mp4"]
        .find(t => MediaRecorder.isTypeSupported(t)) || "";

      mediaRecorder = new MediaRecorder(stream, mimeType ? { mimeType } : {});

      mediaRecorder.ondataavailable = e => {
        if (e.data.size > 0) audioChunks.push(e.data);
      };

      mediaRecorder.onstop = async () => {
        stream.getTracks().forEach(t => t.stop());
        await transcribeAudio(mimeType);
      };

      mediaRecorder.start();
      isRecording = true;

      const micBtn = document.getElementById("mic-btn");
      micBtn.classList.add("recording");
      micBtn.textContent = "⏹";
      setVoiceStatus("🔴 Recording… click ⏹ to stop");
    } catch (err) {
      setVoiceStatus("Microphone access denied.");
      console.error(err);
    }
  }

  function stopRecording() {
    if (mediaRecorder && isRecording) {
      mediaRecorder.stop();
      isRecording = false;

      const micBtn = document.getElementById("mic-btn");
      micBtn.classList.remove("recording");
      micBtn.textContent = "🎤";
      setVoiceStatus("Processing…");
    }
  }

  async function transcribeAudio(mimeType) {
    const ext = mimeType.includes("ogg") ? "ogg" : mimeType.includes("mp4") ? "mp4" : "webm";
    const blob = new Blob(audioChunks, { type: mimeType || "audio/webm" });
    const formData = new FormData();
    formData.append("audio", blob, `recording.${ext}`);

    try {
      const res = await fetch("/transcribe", { method: "POST", body: formData });
      const data = await res.json();

      if (data.text) {
        setVoiceStatus("");
        document.getElementById("question").value = data.text;
        await sendMessage(data.text);
      } else {
        setVoiceStatus("Could not understand audio. Please try again.");
      }
    } catch (err) {
      setVoiceStatus("Transcription error. Please try again.");
      console.error(err);
    }
  }

  // ── Keyboard shortcut ────────────────────────────────────────────────────
  document.getElementById("question").addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  initSession();
</script>

</body>
</html>
