<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RAG Chatbot</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f2f5;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #1a1a2e;
      color: white;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    header h1 { font-size: 1.2rem; font-weight: 600; }
    header p  { font-size: 0.8rem; opacity: 0.6; margin-top: 2px; }

    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
    }

    .message {
      display: flex;
      flex-direction: column;
      max-width: 75%;
    }

    .message.user  { align-self: flex-end; align-items: flex-end; }
    .message.bot   { align-self: flex-start; align-items: flex-start; }

    .bubble {
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 0.92rem;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .user .bubble {
      background: #1a1a2e;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .bot .bubble {
      background: white;
      color: #333;
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    .sources {
      font-size: 0.75rem;
      color: #888;
      margin-top: 4px;
      padding: 0 4px;
    }

    .sources span {
      background: #e8eaf6;
      color: #3949ab;
      padding: 2px 8px;
      border-radius: 10px;
      margin-right: 4px;
      display: inline-block;
      margin-top: 3px;
    }

    .typing .bubble {
      color: #aaa;
      font-style: italic;
    }

    #input-area {
      background: white;
      border-top: 1px solid #e0e0e0;
      padding: 16px 24px;
    }

    #input-row {
      display: flex;
      gap: 10px;
      max-width: 800px;
      margin: 0 auto;
    }

    #question {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #ddd;
      border-radius: 24px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    #question:focus { border-color: #1a1a2e; }

    #send-btn {
      background: #1a1a2e;
      color: white;
      border: none;
      border-radius: 24px;
      padding: 12px 24px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    #send-btn:hover    { background: #16213e; }
    #send-btn:disabled { background: #aaa; cursor: not-allowed; }

    #mic-btn {
      background: #1a1a2e;
      color: white;
      border: none;
      border-radius: 50%;
      width: 46px;
      height: 46px;
      font-size: 1.1rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    #mic-btn:hover    { background: #16213e; }
    #mic-btn:disabled { background: #aaa; cursor: not-allowed; }
    #mic-btn.recording {
      background: #c0392b;
      animation: pulse 1s infinite;
    }

    #live-btn {
      background: transparent;
      color: #1a1a2e;
      border: 2px solid #1a1a2e;
      border-radius: 24px;
      padding: 10px 18px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      flex-shrink: 0;
    }

    #live-btn:hover  { background: #1a1a2e; color: white; }
    #live-btn.active {
      background: #2e7d32;
      border-color: #2e7d32;
      color: white;
      animation: pulse-green 1.5s infinite;
    }

    @keyframes pulse-green {
      0%   { box-shadow: 0 0 0 0 rgba(46,125,50,0.5); }
      70%  { box-shadow: 0 0 0 8px rgba(46,125,50,0); }
      100% { box-shadow: 0 0 0 0 rgba(46,125,50,0); }
    }

    @keyframes pulse {
      0%   { transform: scale(1); box-shadow: 0 0 0 0 rgba(192,57,43,0.5); }
      70%  { transform: scale(1.05); box-shadow: 0 0 0 8px rgba(192,57,43,0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(192,57,43,0); }
    }

    #voice-status {
      text-align: center;
      font-size: 0.78rem;
      color: #c0392b;
      height: 18px;
      margin-bottom: 6px;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
    }

    #welcome {
      text-align: center;
      color: #aaa;
      margin-top: 60px;
    }

    #welcome h2 { font-size: 1.4rem; color: #555; margin-bottom: 8px; }
    #welcome p  { font-size: 0.9rem; }

    /* ── Upload panel ───────────────────────────────────────────────────── */
    #upload-panel {
      background: white;
      border-bottom: 1px solid #e0e0e0;
      padding: 10px 24px;
    }

    #upload-inner {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    #upload-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #f5f5f5;
      border: 1.5px dashed #bbb;
      border-radius: 20px;
      padding: 7px 18px;
      font-size: 0.85rem;
      color: #555;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }

    #upload-label:hover { border-color: #1a1a2e; background: #eef; color: #1a1a2e; }
    #upload-file { display: none; }

    #upload-status {
      font-size: 0.82rem;
      color: #888;
      flex: 1;
    }

    #upload-status.success { color: #2e7d32; }
    #upload-status.error   { color: #c0392b; }

    #doc-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      width: 100%;
      margin-top: 2px;
    }

    .doc-tag {
      background: #e8f5e9;
      color: #2e7d32;
      font-size: 0.75rem;
      padding: 3px 10px;
      border-radius: 10px;
    }
  </style>
</head>
<body>

<header>
  <div>
    <h1>📄 RAG Chatbot</h1>
    <p>Ask anything about your documents</p>
  </div>
</header>

<div id="upload-panel">
  <div id="upload-inner">
    <label id="upload-label" for="upload-file">
      📎 Upload Document
    </label>
    <input id="upload-file" type="file" accept=".pdf,.txt" onchange="uploadDocument(this)"/>
    <span id="upload-status">PDF or TXT — uploaded docs are indexed instantly</span>
    <div id="doc-list"></div>
  </div>
</div>

<div id="chat-container">
  <div id="welcome">
    <h2>Hello! How can I help?</h2>
    <p>Ask me anything about the uploaded documents.</p>
  </div>
</div>

<div id="input-area">
  <div id="voice-status"></div>
  <div id="input-row">
    <button id="live-btn" onclick="toggleLiveMode()" title="Live conversation mode">🔁 Live</button>
    <button id="mic-btn" onclick="toggleRecording()" title="Click to record voice">🎤</button>
    <input
      id="question"
      type="text"
      placeholder="Ask a question or click 🎤 to speak..."
      autocomplete="off"
    />
    <button id="send-btn" onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
  let sessionId   = null;
  let mediaRecorder = null;
  let audioChunks   = [];
  let isRecording   = false;
  let liveMode      = false;   // continuous conversation mode

  // ── Session ──────────────────────────────────────────────────────────────
  async function initSession() {
    const res = await fetch("/session/new", { method: "POST" });
    const data = await res.json();
    sessionId = data.session_id;
    await loadDocuments();
  }

  // ── Document upload ──────────────────────────────────────────────────────
  async function loadDocuments() {
    const res = await fetch("/documents");
    const data = await res.json();
    renderDocTags(data.documents);
  }

  function renderDocTags(docs) {
    const list = document.getElementById("doc-list");
    list.innerHTML = docs.map(d => `<span class="doc-tag">✅ ${d}</span>`).join("");
  }

  async function uploadDocument(input) {
    const file = input.files[0];
    if (!file) return;

    const status = document.getElementById("upload-status");
    const label  = document.getElementById("upload-label");

    status.textContent = `Uploading "${file.name}"…`;
    status.className = "";
    label.style.pointerEvents = "none";

    const formData = new FormData();
    formData.append("file", file);

    try {
      const res  = await fetch("/upload", { method: "POST", body: formData });
      const data = await res.json();

      if (res.ok) {
        status.textContent = `✔ "${file.name}" indexed (${data.chunks} chunks)`;
        status.className = "success";
        await loadDocuments();
        const welcome = document.getElementById("welcome");
        if (welcome) welcome.remove();
        appendMessage("bot", `"${file.name}" has been uploaded and indexed. You can now ask questions about it.`);
      } else {
        status.textContent = `✖ ${data.error}`;
        status.className = "error";
      }
    } catch (err) {
      status.textContent = "Upload failed. Please try again.";
      status.className = "error";
    }

    label.style.pointerEvents = "";
    input.value = "";
  }

  // ── UI helpers ───────────────────────────────────────────────────────────
  function setVoiceStatus(msg) {
    document.getElementById("voice-status").textContent = msg;
  }

  function appendMessage(role, text, sources = []) {
    const welcome = document.getElementById("welcome");
    if (welcome) welcome.remove();

    const container = document.getElementById("chat-container");
    const msg = document.createElement("div");
    msg.className = `message ${role}`;

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    msg.appendChild(bubble);

    if (sources.length > 0) {
      const src = document.createElement("div");
      src.className = "sources";
      src.innerHTML = "📎 Sources: " + sources.map(s => `<span>${s}</span>`).join("");
      msg.appendChild(src);
    }

    container.appendChild(msg);
    container.scrollTop = container.scrollHeight;
    return msg;
  }

  // ── Text-to-speech ───────────────────────────────────────────────────────
  function speak(text, onDone) {
    if (!window.speechSynthesis) { onDone && onDone(); return; }
    window.speechSynthesis.cancel();
    const utt = new SpeechSynthesisUtterance(text);
    utt.rate  = 1.0;
    utt.pitch = 1.0;
    utt.onend = () => { onDone && onDone(); };
    // fallback: if onend doesn't fire (some browsers), estimate duration
    const fallbackMs = Math.max(3000, text.length * 55);
    const fallback = setTimeout(() => { onDone && onDone(); }, fallbackMs);
    utt.onend = () => { clearTimeout(fallback); onDone && onDone(); };
    window.speechSynthesis.speak(utt);
  }

  function stopSpeaking() {
    if (window.speechSynthesis) window.speechSynthesis.cancel();
  }

  // ── Chat ─────────────────────────────────────────────────────────────────
  async function sendMessage(questionOverride) {
    const input  = document.getElementById("question");
    const btn    = document.getElementById("send-btn");
    const micBtn = document.getElementById("mic-btn");
    const question = (questionOverride || input.value).trim();
    if (!question || !sessionId) return;

    input.value  = "";
    btn.disabled = true;
    micBtn.disabled = true;

    appendMessage("user", question);
    const typing = appendMessage("bot typing", "Thinking...");

    try {
      const res  = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId, question }),
      });
      const data = await res.json();

      typing.remove();
      appendMessage("bot", data.answer, data.sources);

      if (liveMode) {
        // Speak answer, then auto-start recording for next turn
        setVoiceStatus("🔊 Speaking…");
        speak(data.answer, () => {
          if (liveMode) {
            setVoiceStatus("");
            startRecording();   // next turn
          }
        });
      } else {
        speak(data.answer);
      }

    } catch (err) {
      typing.remove();
      appendMessage("bot", "Sorry, something went wrong. Please try again.");
      if (liveMode) startRecording();
    }

    btn.disabled    = false;
    micBtn.disabled = false;
    if (!liveMode) input.focus();
  }

  // ── Live mode ─────────────────────────────────────────────────────────────
  function toggleLiveMode() {
    liveMode = !liveMode;
    const btn = document.getElementById("live-btn");

    if (liveMode) {
      btn.classList.add("active");
      btn.textContent = "⏹ Stop Live";
      setVoiceStatus("🟢 Live mode on — listening…");
      startRecording();
    } else {
      btn.classList.remove("active");
      btn.textContent = "🔁 Live";
      stopSpeaking();
      if (isRecording) stopRecording(/* silent */ true);
      setVoiceStatus("");
    }
  }

  // ── Voice recording ──────────────────────────────────────────────────────
  async function toggleRecording() {
    if (isRecording) stopRecording();
    else              await startRecording();
  }

  async function startRecording() {
    try {
      // Stop any ongoing TTS the moment mic opens
      stopSpeaking();

      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      audioChunks  = [];

      const mimeType = ["audio/webm;codecs=opus", "audio/webm", "audio/ogg;codecs=opus", "audio/mp4"]
        .find(t => MediaRecorder.isTypeSupported(t)) || "";

      mediaRecorder = new MediaRecorder(stream, mimeType ? { mimeType } : {});

      mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };

      mediaRecorder.onstop = async () => {
        stream.getTracks().forEach(t => t.stop());
        await transcribeAudio(mimeType);
      };

      mediaRecorder.start();
      isRecording = true;

      const micBtn = document.getElementById("mic-btn");
      micBtn.classList.add("recording");
      micBtn.textContent = "⏹";
      if (!liveMode) setVoiceStatus("🔴 Recording… click ⏹ to stop");
      else           setVoiceStatus("🔴 Listening… click mic to send");

    } catch (err) {
      setVoiceStatus("Microphone access denied.");
      console.error(err);
      if (liveMode) toggleLiveMode(); // exit live mode if mic fails
    }
  }

  // silent=true means don't reset live mode status
  function stopRecording(silent = false) {
    if (mediaRecorder && isRecording) {
      mediaRecorder.stop();
      isRecording = false;

      const micBtn = document.getElementById("mic-btn");
      micBtn.classList.remove("recording");
      micBtn.textContent = "🎤";
      if (!silent) setVoiceStatus("Processing…");
    }
  }

  async function transcribeAudio(mimeType) {
    const ext = mimeType.includes("ogg") ? "ogg" : mimeType.includes("mp4") ? "mp4" : "webm";
    const blob = new Blob(audioChunks, { type: mimeType || "audio/webm" });

    // If blob is too small it's silence — skip in live mode
    if (liveMode && blob.size < 1000) {
      setVoiceStatus("🟢 Live mode on — listening…");
      startRecording();
      return;
    }

    const formData = new FormData();
    formData.append("audio", blob, `recording.${ext}`);

    try {
      const res  = await fetch("/transcribe", { method: "POST", body: formData });
      const data = await res.json();

      if (data.text) {
        setVoiceStatus("");
        document.getElementById("question").value = data.text;
        await sendMessage(data.text);
      } else {
        setVoiceStatus(liveMode ? "🟢 Didn't catch that — listening…" : "Could not understand audio. Try again.");
        if (liveMode) startRecording();
      }
    } catch (err) {
      setVoiceStatus("Transcription error.");
      if (liveMode) startRecording();
      console.error(err);
    }
  }

  // ── Keyboard shortcut ────────────────────────────────────────────────────
  document.getElementById("question").addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      // If recording, stop and send via voice
      if (isRecording) { stopRecording(); return; }
      sendMessage();
    }
  });

  initSession();
</script>

</body>
</html>
