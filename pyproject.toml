requires-python = "==3.13.*"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.0",
    "langchain-core>=0.2.0",
    "langchain-text-splitters>=0.2.0",
    "langchain-groq>=0.1.0",
    "langchain-community>=0.2.0",
    "langchain-chroma>=0.1.0",
    "langchain-cohere>=0.1.0",
    "pypdf>=4.0.0",
    "groq>=0.9.0",
    "cohere>=5.0.0",
    "python-multipart>=0.0.29",
]
